version: '3.8'

services:
  smartapply-api:
    build: .
    container_name: smartapply-kz
    ports:
      - "3200:3200"
    environment:
      - PORT=3200
      - NODE_ENV=production
      - ZAI_API_KEY=${ZAI_API_KEY}
      - LLM_MODEL=glm-4.5-flash
      - ALLOWED_ORIGINS=chrome-extension://*
    volumes:
      - ./server:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3200/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
