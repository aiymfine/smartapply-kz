<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartApply KZ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 380px;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 0;
    }

    .header {
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 12px;
      opacity: 0.85;
    }

    .content {
      padding: 20px;
    }

    .upload-zone {
      border: 2px dashed #334155;
      border-radius: 12px;
      padding: 28px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 16px;
    }

    .upload-zone:hover {
      border-color: #2563eb;
      background: rgba(37, 99, 235, 0.05);
    }

    .upload-zone.has-file {
      border-color: #22c55e;
      background: rgba(34, 197, 94, 0.05);
    }

    .upload-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .upload-zone p {
      font-size: 13px;
      color: #94a3b8;
    }

    .file-info {
      font-size: 12px;
      color: #22c55e;
      margin-top: 6px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
    }

    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
    }

    .btn-secondary:hover { background: #334155; }

    .status {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 12px;
      display: none;
    }

    .status.show { display: block; }
    .status.info { background: rgba(37, 99, 235, 0.1); color: #60a5fa; }
    .status.success { background: rgba(34, 197, 94, 0.1); color: #4ade80; }
    .status.error { background: rgba(239, 68, 68, 0.1); color: #f87171; }
    .status.loading { background: rgba(234, 179, 8, 0.1); color: #facc15; }

    .data-preview {
      background: #1e293b;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
      display: none;
    }

    .data-preview.show { display: block; }

    .data-preview h3 {
      font-size: 12px;
      color: #94a3b8;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .data-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      padding: 4px 0;
      border-bottom: 1px solid #334155;
    }

    .data-row:last-child { border-bottom: none; }
    .data-row .label { color: #94a3b8; }
    .data-row .value { color: #e2e8f0; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .footer {
      padding: 12px 20px;
      text-align: center;
      font-size: 11px;
      color: #475569;
      border-top: 1px solid #1e293b;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(250, 204, 21, 0.2);
      border-top-color: #facc15;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="header">
    <h1>SmartApply KZ</h1>
    <p>AI-powered resume autofill for Kazakhstani job sites</p>
  </div>

  <div class="content">
    <div id="status" class="status"></div>

    <div id="uploadZone" class="upload-zone">
      <div class="upload-icon">📄</div>
      <p>Click to upload resume</p>
      <p style="font-size: 11px; margin-top: 4px;">PDF or DOCX • Max 5MB</p>
      <div id="fileInfo" class="file-info" style="display: none;"></div>
    </div>

    <input type="file" id="fileInput" accept=".pdf,.docx,.doc" style="display: none;">

    <div id="dataPreview" class="data-preview">
      <h3>Extracted Data</h3>
      <div id="dataRows"></div>
    </div>

    <button id="autofillBtn" class="btn btn-primary" disabled>
      ⚡ Autofill This Page
    </button>

    <button id="clearBtn" class="btn btn-secondary" style="display: none;">
      🗑 Clear Resume Data
    </button>
  </div>

  <div class="footer">
    SmartApply KZ • Your data stays in your browser
  </div>

  <script src="popup.js"></script>
</body>
</html>
